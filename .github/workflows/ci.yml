name: CI

on:
  push:
    branches: ["master"]
    tags:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  package-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate package surface (publint + types)
        run: |
          npx -y publint
          # no-resolution: node10 cannot resolve exports-map subpaths; engines is >=18.
          npx -y @arethetypeswrong/cli --pack --ignore-rules no-resolution
      - name: Pack and install into a temp project
        run: |
          set -euo pipefail
          npm pack
          TARBALL="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$OLDPWD/$TARBALL"
          echo "--- ESM import ---"
          node --input-type=module -e "import { YtCaptionKit, extractVideoId } from 'yt-caption-kit'; if (typeof YtCaptionKit !== 'function') process.exit(1); if (extractVideoId('https://youtu.be/GJLlxj_dtq8') !== 'GJLlxj_dtq8') process.exit(1); console.log('esm ok');"
          echo "--- CJS require ---"
          node --input-type=commonjs -e "const { YtCaptionKit } = require('yt-caption-kit'); if (typeof YtCaptionKit !== 'function') process.exit(1); console.log('cjs ok');"
          echo "--- CLI bin ---"
          npx yt-caption-kit --version

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test, package-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
